<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MOEMS High Achievement 2025–2026</title>
<style>
  @media print {
    @page { margin: 0.4in; size: letter portrait; }
    .print-btn { display: none; }
    body { padding: 0; background: white; }
  }

  body {
    margin: 0;
    padding: 32px 20px;
    background: #f5f0e8;
    font-family: Georgia, 'Times New Roman', serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
  }

  .print-btn {
    background: #c47b1a;
    color: white;
    border: none;
    padding: 7px 22px;
    font-size: 0.9rem;
    border-radius: 4px;
    cursor: pointer;
  }
  .print-btn:hover { background: #a66515; }

  .card {
    width: 3in;
    background: white;
    padding: 18px 22px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.12);
    box-sizing: border-box;
  }

  .year {
    text-align: center;
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: #a0681a;
    margin-bottom: 4px;
  }

  .score {
    text-align: center;
    font-size: 10.5px;
    color: #888;
    font-style: italic;
    margin-bottom: 10px;
  }

  .rule {
    border: none;
    border-top: 1px solid #c47b1a;
    opacity: 0.35;
    margin: 0 0 10px;
  }

  table {
    width: 100%;
    border-collapse: collapse;
  }

  tr { border-bottom: 1px solid #f0e8d8; }
  tr:last-child { border-bottom: none; }

  td {
    padding: 4px 6px;
    font-size: 12px;
    color: #222;
  }

  td.grade {
    text-align: right;
    font-size: 10.5px;
    font-style: italic;
    color: #a0681a;
    white-space: nowrap;
  }
</style>
</head>
<body>

<button class="print-btn" onclick="window.print()">Print</button>

<div class="card">
  <div class="year">High Achievement Award &nbsp;·&nbsp; 2025–2026</div>
  <div class="score">Team score: 175 / 250</div>
  <hr class="rule">
  <table>
    <tr><td>Arjun Lakshmanan</td><td class="grade">8th grade</td></tr>
    <tr><td>Ayush Patel</td><td class="grade">7th grade</td></tr>
    <tr><td>Rakin Molla</td><td class="grade">8th grade</td></tr>
    <tr><td>Vihaan Shah</td><td class="grade">8th grade</td></tr>
    <tr><td>Ella Shang</td><td class="grade">8th grade</td></tr>
    <tr><td>Fariq Molla</td><td class="grade">6th grade</td></tr>
    <tr><td>Krish Janoria</td><td class="grade">8th grade</td></tr>
    <tr><td>Vihan Parikh</td><td class="grade">7th grade</td></tr>
    <tr><td>Charles Wang</td><td class="grade">6th grade</td></tr>
    <tr><td>Pihu Patel</td><td class="grade">7th grade</td></tr>
  </table>
</div>

</body>
</html>
