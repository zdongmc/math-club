<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Which Is Bigger? — Estimation Edition</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Arial Black', Arial, sans-serif; background: linear-gradient(135deg, #0f172a 0%, #1a0a3e 100%); min-height: 100vh; color: white; }
.hidden { display: none !important; }

/* ── TITLE SCREEN ── */
#title-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 30px; text-align: center; gap: 22px; }
.title-emoji { font-size: 5rem; }
.title-main  { font-size: 3rem; font-weight: bold; text-shadow: 0 0 32px rgba(255,215,0,0.35); }
.title-edition { font-size: 1.1rem; opacity: 0.5; letter-spacing: 3px; text-transform: uppercase; font-family: Arial, sans-serif; font-weight: normal; }
.title-sub   { font-size: 1.15rem; opacity: 0.6; max-width: 500px; line-height: 1.6; font-family: Georgia, serif; font-weight: normal; }
.btn-open-tv { background: #ffd700; color: #1a1a1a; border: none; padding: 16px 44px; font-size: 1.1rem; font-family: inherit; font-weight: bold; border-radius: 12px; cursor: pointer; transition: background 0.15s; }
.btn-open-tv:hover { background: #ffe44d; }
.title-steps { display: flex; flex-direction: column; gap: 10px; max-width: 520px; text-align: left; }
.title-step  { display: flex; align-items: flex-start; gap: 12px; font-family: Georgia, serif; font-size: 1.05rem; line-height: 1.5; font-weight: normal; opacity: 0.85; }
.step-num    { background: #ffd700; color: #1a1a1a; font-family: 'Arial Black', Arial, sans-serif; font-size: 0.85rem; font-weight: bold; width: 24px; height: 24px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; margin-top: 2px; }

/* ── QUESTION SCREEN ── */
#q-screen { display: flex; flex-direction: column; min-height: 100vh; padding: 16px 22px 20px; gap: 14px; }
.q-topbar  { display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
.q-num     { font-size: 0.85rem; opacity: 0.45; letter-spacing: 1.5px; text-transform: uppercase; font-family: Arial, sans-serif; font-weight: normal; }
.btn-tv-sm { background: rgba(255,255,255,0.1); color: white; border: 1px solid rgba(255,255,255,0.22); border-radius: 8px; padding: 6px 14px; font-size: 0.8rem; cursor: pointer; font-family: inherit; }
.btn-tv-sm:hover { background: rgba(255,255,255,0.2); }
.q-prompt  { font-size: 1.35rem; text-align: center; opacity: 0.65; flex-shrink: 0; font-family: Georgia, serif; font-weight: normal; }

.options-row { flex: 1; display: grid; grid-template-columns: 1fr 56px 1fr; gap: 14px; align-items: stretch; min-height: 200px; }
.opt-card { border-radius: 16px; padding: 22px 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; text-align: center; border: 3px solid transparent; transition: opacity 0.45s, box-shadow 0.45s, border-color 0.45s, background 0.45s; }
.opt-card.a { background: rgba(37,99,235,0.15); border-color: rgba(37,99,235,0.45); }
.opt-card.b { background: rgba(219,39,119,0.15);  border-color: rgba(219,39,119,0.45); }
.opt-letter { font-size: 1.4rem; font-weight: bold; padding: 6px 22px; border-radius: 20px; }
.opt-card.a .opt-letter { background: rgba(37,99,235,0.3); color: #93c5fd; }
.opt-card.b .opt-letter { background: rgba(219,39,119,0.3); color: #f9a8d4; }
.opt-text { font-size: 1.4rem; line-height: 1.4; font-family: Georgia, serif; font-weight: normal; }
.vs-col   { display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.vs-label { font-size: 1.9rem; font-weight: bold; color: #ffd700; text-shadow: 0 0 18px rgba(255,215,0,0.65); }

/* Card states after reveal */
.opt-card.winner { border-color: #ffd700; box-shadow: 0 0 28px rgba(255,215,0,0.35); background: rgba(255,215,0,0.1); }
.opt-card.loser  { opacity: 0.38; }
.winner-badge { background: #ffd700; color: #1a1a1a; font-size: 0.85rem; padding: 5px 16px; border-radius: 20px; font-weight: bold; }

.q-hint { font-size: 0.95rem; opacity: 0.45; text-align: center; flex-shrink: 0; font-family: Georgia, serif; font-weight: normal; min-height: 1.4em; }

/* ── TIMER ── */
#timer-wrap { flex-shrink: 0; display: flex; flex-direction: column; align-items: center; gap: 6px; }
#timer-num  { font-size: 3.2rem; font-weight: bold; line-height: 1; transition: color 0.3s; }
#timer-num.warn { color: #fbbf24; }
#timer-num.crit { color: #ef4444; animation: tpulse 0.5s infinite alternate; }
#timer-num.done { color: #ef4444; font-size: 1.1rem; letter-spacing: 1px; }
@keyframes tpulse { from { opacity:1; } to { opacity:0.25; } }
#timer-track { width: 100%; max-width: 420px; height: 10px; background: rgba(255,255,255,0.15); border-radius: 5px; overflow: hidden; }
#timer-fill  { height: 100%; background: #22c55e; border-radius: 5px; transition: width 1s linear, background 0.3s; }
#timer-fill.warn { background: #fbbf24; }
#timer-fill.crit { background: #ef4444; }

/* Reveal math panel */
#reveal-panel { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.12); border-radius: 14px; padding: 16px 22px; flex-shrink: 0; display: flex; flex-direction: column; gap: 10px; animation: slideUp 0.42s cubic-bezier(0.34,1.56,0.64,1); }
@keyframes slideUp { from { opacity:0; transform:translateY(22px); } to { opacity:1; transform:translateY(0); } }
.reveal-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.reveal-col { background: rgba(0,0,0,0.22); border-radius: 10px; padding: 10px 14px; }
.reveal-col-label { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 1px; opacity: 0.45; margin-bottom: 5px; }
.reveal-col.a .reveal-col-label { color: #93c5fd; }
.reveal-col.b .reveal-col-label { color: #f9a8d4; }
.reveal-col-math { font-size: 0.98rem; line-height: 1.55; font-family: Georgia, serif; font-weight: normal; white-space: pre-line; }
.reveal-explain  { font-size: 1.08rem; text-align: center; color: #ffd700; font-family: Georgia, serif; font-weight: normal; }
.reveal-surprise { font-size: 0.9rem; text-align: center; opacity: 0.55; font-family: Georgia, serif; font-weight: normal; }
</style>
</head>
<body>

<!-- ── TITLE SCREEN ── -->
<div id="title-screen">
  <div class="title-emoji">🔭</div>
  <div class="title-main">Which Is Bigger?</div>
  <div class="title-edition">Estimation Edition</div>
  <div class="title-sub">Two quantities. One is larger. Can you guess which?</div>
  <div class="title-steps">
    <div class="title-step"><span class="step-num">1</span>Two quantities appear — A and B.</div>
    <div class="title-step"><span class="step-num">2</span>Vote before the timer runs out — then see how big the numbers really are.</div>
  </div>
  <button class="btn-open-tv" onclick="openTeacherView()">🎓 Open Teacher View</button>
</div>

<!-- ── QUESTION SCREEN ── -->
<div id="q-screen" class="hidden">
  <div class="q-topbar">
    <div class="q-num" id="q-num">Question 1 of 24</div>
    <button class="btn-tv-sm" onclick="openTeacherView()">🎓 Teacher View</button>
  </div>

    </div>
  </div>

    <div id="timer-num">15</div>
    <div id="timer-track"><div id="timer-fill" style="width:100%"></div></div>
  </div>
  <div class="q-hint" id="q-hint"></div>
  <div id="reveal-panel" class="hidden">
    <div class="reveal-row">
      <div class="reveal-col a">
        <div class="reveal-col-label">Option A — the number</div>

      <div class="reveal-col b">

    <div class="reveal-surprise" id="reveal-surprise"></div>
  </div>
</div>

<script>
// ── QUESTIONS ──────────────────────────────────────────────────────────────────
const QUESTIONS = [
  // ── easy: both quantities are familiar ────────────────────────────────────────

.tvbtn-gold{background:#ffd700;color:#1a1a1a;border:none}
.tvbtn-gold:hover:not(:disabled){background:#ffe44d}
.tv-qlist-wrap{background:rgba(0,0,0,0.25);border-radius:10px;padding:8px;flex-shrink:0}
.tv-qlist-lbl{font-size:0.62rem;opacity:0.35;text-transform:uppercase;letter-spacing:1px;margin-bottom:5px;font-family:Arial,sans-serif;font-weight:normal}
#tv-qlist{display:flex;flex-wrap:wrap;gap:5px}
.tv-qchip{width:30px;height:22px;border:none;border-radius:4px;font-size:0.72rem;font-weight:bold;cursor:pointer;background:rgba(255,255,255,0.1);color:white;display:flex;align-items:center;justify-content:center;transition:background 0.12s;font-family:inherit}
.tv-qchip:hover{background:rgba(255,255,255,0.22)}
.tv-qchip.active{background:#ffd700;color:#1a1a1a}
</style></head><body>
<h1>Which Is Bigger? — Teacher View</h1>
<div id="tv-qnum">No question loaded</div>
<div id="tv-opts">
  <div class="tv-opt a"><div class="tv-opt-lbl">Option A</div><div class="tv-opt-text" id="tv-opta">—</div></div>
  <div class="tv-opt b"><div class="tv-opt-lbl">Option B</div><div class="tv-opt-text" id="tv-optb">—</div></div>
</div>
<div id="tv-answer">
  <div class="tv-ans-hdr">Answer (teacher only)</div>
  <div id="tv-ans-rows">
    <div class="tv-ans-col a"><div class="tv-ans-col-lbl">Option A</div><div class="tv-ans-col-text" id="tv-matha">—</div></div>
    <div class="tv-ans-col b"><div class="tv-ans-col-lbl">Option B</div><div class="tv-ans-col-text" id="tv-mathb">—</div></div>
  </div>
  <div id="tv-explain">—</div>
  <div id="tv-surprise"></div>
</div>
<div class="tv-btnrow">
  <button class="tvbtn tvbtn-ghost" id="btn-prev"   onclick="if(window.opener)window.opener.prevQuestion()" disabled>← Prev</button>
  <button class="tvbtn tvbtn-gold"  id="btn-reveal" onclick="if(window.opener)window.opener.revealAnswer()" disabled>Reveal Answer</button>
  <button class="tvbtn tvbtn-ghost" id="btn-next"   onclick="if(window.opener)window.opener.nextQuestion()" disabled>Next →</button>
</div>
<div class="tv-qlist-wrap">
  <div class="tv-qlist-lbl">Quick jump — click to show on student screen</div>
  <div id="tv-qlist"></div>
</div>
<script>
(function() {
  const n = ${QUESTIONS.length};
  const list = document.getElementById('tv-qlist');
  for (let i = 0; i < n; i++) {
    const btn = document.createElement('button');
    btn.id = 'tvchip-' + i;
    btn.className = 'tv-qchip';
    btn.textContent = i + 1;
    btn.onclick = () => { if (window.opener) window.opener.showQuestion(i); };
    list.appendChild(btn);
  }
})();
<\/script>
</body></html>`;

// ── TEACHER SYNC ───────────────────────────────────────────────────────────────
function tvSync() {
  if (!teacherWin || teacherWin.closed) return;
  const d   = teacherWin.document;
  const idx = currentIdx;
  const n   = QUESTIONS.length;
  const set = (id, val) => { const el = d.getElementById(id); if (el) el.textContent = val; };

  set('tv-qnum', idx >= 0 ? 'Question ' + (idx + 1) + ' of ' + n : 'No question loaded');

  if (idx >= 0) {
    const q = QUESTIONS[idx];
    set('tv-opta',    q.optA);
    set('tv-optb',    q.optB);
    set('tv-matha',   q.mathA);
    set('tv-mathb',   q.mathB);
    set('tv-explain', q.explain);
    set('tv-surprise', q.surprise);

    const btnPrev   = d.getElementById('btn-prev');
    const btnReveal = d.getElementById('btn-reveal');
    const btnNext   = d.getElementById('btn-next');
    if (btnPrev)   btnPrev.disabled   = (idx === 0);
    if (btnReveal) btnReveal.disabled = false;
    if (btnNext)   btnNext.disabled   = (idx === n - 1);

    d.querySelectorAll('.tv-qchip').forEach((c, j) => c.classList.toggle('active', j === idx));
  }
}

// ── OPEN TEACHER VIEW ──────────────────────────────────────────────────────────
function openTeacherView() {
  if (teacherWin && !teacherWin.closed) { teacherWin.focus(); tvSync(); return; }
  teacherWin = window.open('', 'wib-teacher',
    'width=820,height=650,menubar=no,toolbar=no,location=no,status=no,resizable=yes');
  teacherWin.document.open();
  teacherWin.document.write(TV_HTML);
  teacherWin.document.close();
  tvSync();
}

// ── SHOW QUESTION ──────────────────────────────────────────────────────────────
function showQuestion(idx) {
  const q  = QUESTIONS[idx];
  currentIdx = idx;

  document.getElementById('q-num').textContent =
    'Question ' + (idx + 1) + ' of ' + QUESTIONS.length;
  document.getElementById('opt-a-text').textContent = q.optA;
  document.getElementById('opt-b-text').textContent = q.optB;
  document.getElementById('q-hint').textContent = '';

  const cardA = document.getElementById('card-a');
  const cardB = document.getElementById('card-b');
  cardA.className = 'opt-card a';
  cardB.className = 'opt-card b';
  cardA.querySelectorAll('.winner-badge').forEach(el => el.remove());
  cardB.querySelectorAll('.winner-badge').forEach(el => el.remove());

  document.getElementById('reveal-panel').classList.add('hidden');
  document.getElementById('timer-wrap').classList.add('hidden');

  document.getElementById('title-screen').classList.add('hidden');
  document.getElementById('q-screen').classList.remove('hidden');

  soundNext(getAudio());
  tvSync();
  startTimer();
}

function prevQuestion() { if (currentIdx > 0) showQuestion(currentIdx - 1); }
function nextQuestion() { if (currentIdx < QUESTIONS.length - 1) showQuestion(currentIdx + 1); }

// ── REVEAL ANSWER ──────────────────────────────────────────────────────────────
function revealAnswer() {
  if (currentIdx < 0) return;
  stopTimer();
  document.getElementById('timer-wrap').classList.add('hidden');
  const q = QUESTIONS[currentIdx];

  document.getElementById('math-a').textContent        = q.mathA;
  document.getElementById('math-b').textContent        = q.mathB;
  document.getElementById('reveal-explain').textContent = q.explain;
  document.getElementById('reveal-surprise').textContent = '💡 ' + q.surprise;
  document.getElementById('reveal-panel').classList.remove('hidden');

  const cardA = document.getElementById('card-a');
  const cardB = document.getElementById('card-b');

  function badge(text) {
    const s = document.createElement('span');
    s.className = 'winner-badge';
    s.textContent = text;
    return s;
  }

  if (q.winner === 'A') {
    cardA.className = 'opt-card a winner';
    cardB.className = 'opt-card b loser';
    cardA.appendChild(badge('🏆 Bigger'));
  } else {
    cardA.className = 'opt-card a loser';
    cardB.className = 'opt-card b winner';
    cardB.appendChild(badge('🏆 Bigger'));
  }

  document.getElementById('q-hint').textContent = '';
  soundReveal(getAudio());
}

// ── TIMER ──────────────────────────────────────────────────────────────────────
const TIMER_SECS = 15;
let timerIv      = null;
let timerLeft    = TIMER_SECS;

function startTimer() {
  stopTimer();
  timerLeft = TIMER_SECS;
  document.getElementById('timer-wrap').classList.remove('hidden');
  renderTimer();
  timerIv = setInterval(() => {
    timerLeft--;
    renderTimer();
    if (timerLeft <= 3 && timerLeft > 0) soundTick(getAudio());
    if (timerLeft <= 0) {
      stopTimer();
      const numEl = document.getElementById('timer-num');
      numEl.textContent = "TIME'S UP!";
      numEl.className   = 'done';
      document.getElementById('timer-fill').style.width = '0%';
      document.getElementById('timer-fill').className   = 'crit';
      document.getElementById('q-hint').textContent = 'Lock in your vote — then wait for the reveal!';
      soundDing(getAudio());
    }
  }, 1000);
}

function stopTimer() {
  clearInterval(timerIv);
  timerIv = null;
}

function renderTimer() {
  const numEl  = document.getElementById('timer-num');
  const fillEl = document.getElementById('timer-fill');
  const pct    = (timerLeft / TIMER_SECS) * 100;
  numEl.textContent = timerLeft;
  fillEl.style.width = pct + '%';
  const warn = timerLeft <= 8;
  const crit = timerLeft <= 4;
  numEl.className  = crit ? 'crit' : warn ? 'warn' : '';
  fillEl.className = crit ? 'crit' : warn ? 'warn' : '';
}

// ── AUDIO ──────────────────────────────────────────────────────────────────────
let audioCtx = null;
function getAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}
function note(ctx, freq, t, dur, vol = 0.25, type = 'sine') {
  const o = ctx.createOscillator(), g = ctx.createGain();
  o.connect(g); g.connect(ctx.destination);
  o.type = type; o.frequency.setValueAtTime(freq, t);
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.start(t); o.stop(t + dur);
}
function soundTick(ctx)   { note(ctx, 660, ctx.currentTime, 0.07, 0.12); }
function soundDing(ctx)   { note(ctx, 880, ctx.currentTime, 0.4,  0.18); }
function soundNext(ctx) {
  const t = ctx.currentTime;
  note(ctx, 440, t,      0.1,  0.14);
  note(ctx, 554, t+0.1,  0.14, 0.14);
}
function soundReveal(ctx) {
  const t = ctx.currentTime;
  note(ctx, 523, t,      0.15, 0.22);
  note(ctx, 659, t+0.13, 0.15, 0.22);
  note(ctx, 784, t+0.26, 0.38, 0.28);
}
</script>
