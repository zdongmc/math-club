<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prime or Not - Leaderboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #dc2626 0%, #991b1b 100%);
            min-height: 100vh;
            color: #333;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            padding: 40px;
            animation: fadeIn 0.5s ease;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.5rem;
            color: #dc2626;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1.1rem;
            color: #666;
        }

        .leaderboard-table {
            width: 100%;
            border-collapse: collapse;
        }

        .leaderboard-table th {
            background: linear-gradient(135deg, #dc2626, #991b1b);
            color: white;
            padding: 12px 15px;
            text-align: left;
            font-weight: bold;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .leaderboard-table td {
            padding: 10px 15px;
            border-bottom: 1px solid #e5e7eb;
        }

        .leaderboard-table tr:hover td {
            background: #f3f4f6;
        }

        .leaderboard-table tbody tr:nth-child(1) td {
            background: rgba(255, 215, 0, 0.2);
            font-weight: bold;
        }

        .leaderboard-table tbody tr:nth-child(2) td {
            background: rgba(192, 192, 192, 0.2);
        }

        .leaderboard-table tbody tr:nth-child(3) td {
            background: rgba(205, 127, 50, 0.2);
        }

        .rank-badge {
            display: inline-block;
            min-width: 30px;
            text-align: center;
            font-weight: bold;
        }

        .rank-badge.gold   { color: #ffd700; }
        .rank-badge.silver { color: #c0c0c0; }
        .rank-badge.bronze { color: #cd7f32; }

        .btn {
            background: linear-gradient(135deg, #dc2626, #991b1b);
            color: white;
            padding: 12px 30px;
            border: none;
            border-radius: 25px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            text-decoration: none;
            display: inline-block;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(220, 38, 38, 0.4);
        }

        .actions {
            text-align: center;
            margin-top: 20px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* Drawing Standings */
        .drawing-section {
            background: linear-gradient(135deg, #fef3c7, #fde68a);
            border: 2px solid #f59e0b;
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 30px;
        }
        .drawing-section h3 {
            color: #92400e;
            font-size: 1.4rem;
            margin-bottom: 6px;
            text-align: center;
        }
        .drawing-section .drawing-subtitle {
            text-align: center;
            color: #78350f;
            font-size: 0.9rem;
            margin-bottom: 18px;
        }
        .drawing-table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            border-radius: 10px;
            overflow: hidden;
        }
        .drawing-table th {
            background: #f59e0b;
            color: #78350f;
            padding: 10px 14px;
            text-align: left;
            font-weight: bold;
        }
        .drawing-table td {
            padding: 10px 14px;
            border-bottom: 1px solid #fde68a;
            font-size: 0.95rem;
        }
        .drawing-table tr.my-row td {
            background: #ecfdf5;
            font-weight: bold;
            color: #166534;
        }
        .drawing-table tr.my-row td:first-child::before {
            content: '★ ';
        }
        .drawing-entry-count {
            text-align: center;
            font-size: 1.1rem;
            font-weight: bold;
            color: #92400e;
            margin-top: 14px;
        }
        .drawing-refresh {
            text-align: center;
            margin-top: 12px;
        }
        .drawing-refresh button {
            background: #f59e0b;
            color: #78350f;
            border: none;
            border-radius: 20px;
            padding: 8px 20px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.88rem;
        }
        .drawing-loading {
            text-align: center;
            color: #92400e;
            padding: 20px;
            font-style: italic;
        }

        /* Per-range leaderboard sections */
        .range-section {
            margin-bottom: 28px;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            overflow: hidden;
        }
        .range-section-title {
            background: linear-gradient(135deg, #dc2626, #991b1b);
            color: white;
            padding: 12px 18px;
            font-size: 1.1rem;
            font-weight: bold;
        }
        .range-section-body {
            background: #f9fafb;
            overflow-x: auto;
        }
        .range-section-empty {
            padding: 20px;
            text-align: center;
            color: #9ca3af;
            font-style: italic;
        }
        .all-ranges-header {
            font-size: 1.4rem;
            font-weight: bold;
            color: #dc2626;
            margin-bottom: 18px;
            text-align: center;
        }
        .loading-message {
            text-align: center;
            padding: 40px;
            color: #666;
            font-size: 1.1rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Prime or Not Leaderboard</h1>
            <p>Top scores for prime number recognition</p>
        </div>

        <!-- Drawing Standings -->
        <div class="drawing-section">
            <h3>🏆 Summer Certificate Drawing Standings</h3>
            <p class="drawing-subtitle">The #1 holder for each range earns a raffle entry. 9 winners will be drawn by raffle!</p>
            <div id="drawingContent"><div class="drawing-loading">Loading standings…</div></div>
            <div class="drawing-refresh"><button onclick="loadAll()">↻ Refresh</button></div>
        </div>

        <!-- All Range Leaderboards -->
        <div class="all-ranges-header">📊 Leaderboards by Range</div>
        <div id="allRangesContent">
            <div class="loading-message">Loading leaderboards…</div>
        </div>

        <div class="actions">
            <a href="prime-or-not.html" class="btn">Play Game</a>
        </div>
    </div>

    <script>
        const LEADERBOARD_API_URL = 'https://script.google.com/macros/s/AKfycbwddZFUQ7G0s4NrXfvbUQcSR2wTAPQ3_q0YQthV6Hok5gOQztPt14nMeXMwAcCEkguV/exec';
        const myMcpsId = new URLSearchParams(window.location.search).get('mcpsId') || '';

        const PRESET_RANGES = [
            [1, 20], [1, 50], [1, 100], [1, 200], [50, 150], [100, 300]
        ];

        async function loadAll() {
            loadDrawingStandings();
            loadAllRanges();
        }

        async function loadDrawingStandings() {
            const div = document.getElementById('drawingContent');
            div.innerHTML = '<div class="drawing-loading">Loading standings…</div>';
            try {
                const resp = await fetch(`${LEADERBOARD_API_URL}?action=getDrawingLeaderboard`);
                const data = await resp.json();
                if (!data.success) throw new Error(data.error || 'unknown');

                if (!data.ranges || data.ranges.length === 0) {
                    div.innerHTML = '<div class="drawing-loading">No qualifying scores yet — play with your MCPS ID to earn entries!</div>';
                    return;
                }

                let myEntries = 0;
                let rows = '';
                for (const r of data.ranges) {
                    const isMe = myMcpsId && r.leader && r.leader.mcpsId === myMcpsId;
                    if (isMe) myEntries++;
                    const leaderName = r.leader ? escapeHtml(r.leader.name) : '—';
                    const accuracy = r.leader ? `${r.leader.accuracy}%` : '—';
                    const time = r.leader ? escapeHtml(r.leader.timeDisplay) : '—';
                    rows += `<tr${isMe ? ' class="my-row"' : ''}>
                        <td>${escapeHtml(r.label)} <span style="font-size:0.8em;color:#999">(min ${r.minQuestions}q)</span></td>
                        <td>${leaderName}</td>
                        <td>${accuracy}</td>
                        <td>${time}</td>
                    </tr>`;
                }

                div.innerHTML = `
                    <table class="drawing-table">
                        <thead><tr><th>Range</th><th>Current Leader</th><th>Accuracy</th><th>Time</th></tr></thead>
                        <tbody>${rows}</tbody>
                    </table>
                    ${myMcpsId ? `<div class="drawing-entry-count">Your drawing entries: <strong>${myEntries + 1}</strong> (1 base + ${myEntries} range${myEntries !== 1 ? 's' : ''} led)</div>` : ''}
                `;
            } catch (e) {
                div.innerHTML = `<div class="drawing-loading">Could not load standings: ${e.message}</div>`;
            }
        }

        async function loadAllRanges() {
            const div = document.getElementById('allRangesContent');
            div.innerHTML = '<div class="loading-message">Loading leaderboards…</div>';
            try {
                const fetches = PRESET_RANGES.map(([min, max]) =>
                    fetch(`${LEADERBOARD_API_URL}?action=getLeaderboard&min=${min}&max=${max}&total=${max - min + 1}&limit=50`)
                        .then(r => r.json())
                        .then(data => ({ min, max, data }))
                        .catch(() => ({ min, max, data: { success: false } }))
                );
                const results = await Promise.all(fetches);

                let html = '';
                for (const { min, max, data } of results) {
                    const scores = data.success ? (data.scores || []) : [];
                    if (scores.length === 0) continue;
                    html += buildRangeSection(min, max, scores);
                }

                div.innerHTML = html || '<div class="loading-message">No scores found yet — be the first to play!</div>';
            } catch (e) {
                div.innerHTML = `<div class="loading-message">Could not load leaderboards: ${e.message}</div>`;
            }
        }

        function buildRangeSection(min, max, scores) {
            let rows = '';
            scores.forEach((score, i) => {
                const rank = i + 1;
                let rankClass = '', rankDisplay = rank;
                if (rank === 1) { rankClass = 'gold';   rankDisplay = '🥇 1'; }
                else if (rank === 2) { rankClass = 'silver'; rankDisplay = '🥈 2'; }
                else if (rank === 3) { rankClass = 'bronze'; rankDisplay = '🥉 3'; }
                const isMe = myMcpsId && score.mcpsId === myMcpsId;
                rows += `<tr${isMe ? ' style="background:#ecfdf5;"' : ''}>
                    <td><span class="rank-badge ${rankClass}">${rankDisplay}</span></td>
                    <td>${escapeHtml(score.playerName)}${isMe ? ' <strong style="color:#166534">(You)</strong>' : ''}</td>
                    <td>${score.accuracy}%</td>
                    <td>${score.timeDisplay}</td>
                    <td>${score.correct}</td>
                    <td>${score.incorrect}</td>
                </tr>`;
            });

            return `<div class="range-section">
                <div class="range-section-title">Range ${min}–${max}</div>
                <div class="range-section-body">
                    <table class="leaderboard-table">
                        <thead><tr>
                            <th>Rank</th><th>Player</th><th>Accuracy</th>
                            <th>Time</th><th>Correct</th><th>Incorrect</th>
                        </tr></thead>
                        <tbody>${rows}</tbody>
                    </table>
                </div>
            </div>`;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        window.addEventListener('DOMContentLoaded', loadAll);
    </script>
</body>
</html>
